[project]
name = "jaam-ohca-analysis"
version = "1.0.0"
description = "Reproducible analysis for treatment-effect heterogeneity of a CAG-based strategy after OHCA"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
  { name = "Makoto Nishimori" }
]
dependencies = [
  "lightgbm==4.5.0",
  "matplotlib==3.9.2",
  "miceforest==6.0.3",
  "numpy==2.1.2",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "statsmodels==0.14.4"
]

[tool.poetry]
package-mode = true
packages = [
  { include = "jaam", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
